<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clínica Médica</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Arial, Helvetica, sans-serif
}

body {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	background: linear-gradient(135deg, #edf3f2 0%, #e4efef 45%, #dbe7ed 100%);
	color: #2e3940
}

.container {
	width: 90%;
	max-width: 700px;
	padding: 45px;
	border-radius: 30px;
	background: rgba(255, 255, 255, .78);
	backdrop-filter: blur(10px);
	border: 1px solid rgba(120, 145, 155, .18);
	box-shadow: 0 15px 40px rgba(40, 60, 70, .12);
	text-align: center
}

h1 {
	font-size: 2rem;
	color: #2e5b67;
	margin-bottom: 25px
}

p {
	color: #5f767d;
	margin-bottom: 30px;
	font-size: 1.05rem
}

.botao {
	display: inline-block;
	text-decoration: none;
	background: linear-gradient(135deg, #4e7983, #5d8f8a);
	color: #fff;
	padding: 14px 26px;
	border-radius: 14px;
	font-weight: bold;
	letter-spacing: .3px;
	transition: .25s ease
}

.botao:hover {
	transform: scale(1.03);
	background: linear-gradient(135deg, #446a73, #537f7a)
}

.voltar {
	display: block;
	margin-top: 18px;
	color: #4f6f77;
	text-decoration: none;
	font-weight: bold
}

.voltar:hover {
	text-decoration: underline
}
</style>
</head>
<body>
	<div class="container">
		<h1>Médico cadastrado com sucesso!</h1>
		<p>O registro foi salvo no sistema da clínica.</p>
		<a class="botao" href="listarTodosMedicos">Listar todos os médicos</a>
		<a class="voltar" href="paginaPrincipal">← Voltar ao início</a>
	</div>
</body>
</html>
