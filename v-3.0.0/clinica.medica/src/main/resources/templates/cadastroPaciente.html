<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Cadastro de Paciente</title>

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Arial, Helvetica, sans-serif;
}

body {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	background: linear-gradient(135deg, #edf3f2 0%, #e4efef 45%, #dbe7ed 100%);
	color: #2e3940;
}

.container {
	width: 90%;
	max-width: 900px;
	padding: 45px;
	border-radius: 30px;
	background: rgba(255,255,255,.78);
	backdrop-filter: blur(10px);
	border: 1px solid rgba(120,145,155,.18);
	box-shadow: 0 15px 40px rgba(40,60,70,.12);
}

.topo {
	text-align: center;
	margin-bottom: 35px;
}

.topo h1 {
	font-size: 2.4rem;
	color: #2e5b67;
}

.form {
	display: grid;
	gap: 18px;
}

.campo {
	display: flex;
	flex-direction: column;
	gap: 6px;
}

label {
	color: #4f6b73;
	font-weight: bold;
	font-size: .95rem;
}

input {
	padding: 12px 14px;
	border-radius: 12px;
	border: 1px solid #cddadd;
	outline: none;
	background: #f7fbfb;
}

input:focus {
	border-color: #5d8e8b;
	box-shadow: 0 0 0 3px rgba(93,142,139,.15);
}

.linha {
	display: grid;
	grid-template-columns: repeat(12, 1fr);
	gap: 15px;
}

.col-6 {
	grid-column: span 6;
}

.col-3 {
	grid-column: span 3;
}

.titulo-secundario {
	color: #2e5b67;
	font-size: 1.2rem;
	margin-top: 10px;
}

.botoes {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-top: 25px;
}

.botao {
	background: linear-gradient(135deg, #4e7983, #5d8f8a);
	color: white;
	padding: 12px 22px;
	border-radius: 14px;
	font-weight: bold;
	border: none;
	cursor: pointer;
}

.botao:hover {
	transform: scale(1.03);
}

.voltar {
	color: #4f6f77;
	text-decoration: none;
	font-weight: bold;
}

@media(max-width:700px) {
	.col-6,
	.col-3 {
		grid-column: span 12;
	}
}
</style>
</head>

<body>
<div class="container">

	<div class="topo">
		<h1>Cadastro de Paciente</h1>
	</div>

	<form action="cadastrarPaciente" method="post" class="form">

		<div class="campo">
			<label>Nome</label>
			<input type="text" name="nome">
		</div>

		<div class="linha">
			<div class="campo col-6">
				<label>Email</label>
				<input type="email" name="email">
			</div>

			<div class="campo col-6">
				<label>CPF</label>
				<input type="text" name="cpf">
			</div>
		</div>

		<div class="linha">
			<div class="campo col-6">
				<label>Data de Nascimento</label>
				<input type="text" name="dataNascimento" placeholder="dd/mm/aaaa">
			</div>

			<div class="campo col-6">
				<label>Telefone de Contato</label>
				<input type="text" name="telefoneContato">
			</div>
		</div>

		<div class="titulo-secundario">
			Endereço
		</div>

		<div class="linha">
			<div class="campo col-6">
				<label>Estado</label>
				<input type="text" name="endereco.estado">
			</div>

			<div class="campo col-6">
				<label>Cidade</label>
				<input type="text" name="endereco.cidade">
			</div>
		</div>

		<div class="linha">
			<div class="campo col-6">
				<label>Logradouro</label>
				<input type="text" name="endereco.logradouro">
			</div>

			<div class="campo col-3">
				<label>Número</label>
				<input type="text" name="endereco.numero">
			</div>

			<div class="campo col-3">
				<label>Complemento</label>
				<input type="text" name="endereco.complemento">
			</div>
		</div>

		<div class="botoes">
			<a class="voltar" href="paginaPrincipal">← Voltar</a>

			<button type="submit" class="botao">
				Salvar
			</button>
		</div>

	</form>

</div>
</body>
</html>
